name: Update dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths:
      - "source/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      SLEEPER_LEAGUE_ID: "1397593463293239296"
      SLEEPER_MAX_WEEK: "18"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python -m pip install openpyxl

      - name: Build legacy data
        run: python scripts/build_legacy.py

      - name: Fetch current league data
        run: python scripts/fetch_live.py

      - name: Fetch weekly matchups, players and transactions
        run: python scripts/fetch_weekly.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/franchises.json data/history.json data/live.json
          git add data/weekly.json data/transactions.json data/players.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update legacy, live and weekly dashboard data"
            git push origin main
          fi
